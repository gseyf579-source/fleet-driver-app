<!-- Paste right after <body> in manager.html (set APP_MODE = "manager") or index.html (set APP_MODE = "driver") -->
<div id="fleetPinModal" style="position:fixed;inset:0;background:#0f172a;z-index:99999;display:flex;align-items:center;justify-content:center;padding:18px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;">
  <div id="fleetPinCard" style="background:#1e293b;border:1px solid #334155;border-radius:16px;padding:24px;width:100%;max-width:370px;color:#f8fafc;box-shadow:0 20px 40px rgba(0,0,0,0.45);">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <img src="https://gseyf579-source.github.io/fleet-driver-app/20261120_100413_0000.png" alt="Truck Icon" style="width:42px;height:42px;border-radius:10px;object-fit:cover;">
        <strong id="pinBrandTitle" style="font-size:16px;">Fleet System</strong>
      </div>
      <button type="button" id="pinLangBtn" onclick="togglePinLang()" style="padding:6px 10px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#e2e8f0;font-size:12px;cursor:pointer;">
        العربية
      </button>
    </div>

    <h2 id="pinHeading" style="margin:4px 0 6px;font-size:20px;">Security Lock</h2>
    <p id="pinSubtext" style="margin:0 0 16px;color:#94a3b8;font-size:13px;">Enter your credentials to continue</p>

    <div id="driverIdGroup" style="display:none;margin-bottom:12px;">
      <label id="driverIdLabel" for="pinVehicleId" style="display:block;font-size:13px;color:#cbd5e1;margin-bottom:6px;">Vehicle ID</label>
      <input id="pinVehicleId" type="text" placeholder="TRK-01" style="width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:15px;text-transform:uppercase;">
    </div>

    <div style="margin-bottom:16px;">
      <label id="pinCodeLabel" for="pinCodeInput" style="display:block;font-size:13px;color:#cbd5e1;margin-bottom:6px;">PIN Code</label>
      <input id="pinCodeInput" type="password" inputmode="numeric" maxlength="10" placeholder="••••" style="width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:20px;letter-spacing:5px;text-align:center;">
    </div>

    <button type="button" id="pinSubmitBtn" onclick="submitPinLogin()" style="width:100%;padding:13px;border:none;border-radius:10px;background:#2563eb;color:#fff;font-size:15px;font-weight:700;cursor:pointer;">
      Unlock
    </button>

    <div id="pinMsg" style="margin-top:12px;font-size:13px;text-align:center;color:#f87171;min-height:18px;"></div>
  </div>
</div>

<script>
  const PIN_API_URL = "https://script.google.com/macros/s/AKfycbzBEGk_tVcQ3djSVTHisqbRwpy40kQ6acAZC9ph8Sb7NcShT78J0NuSYqG5mYubsnym_g/exec";
  const APP_MODE = "driver"; // Change to "driver" inside index.html

  const PIN_I18N = {
    en: {
      dir: "ltr",
      switchLabel: "العربية",
      brandManager: "Fleet Manager",
      brandDriver: "Driver Console",
      headingManager: "Manager PIN Lock",
      headingDriver: "Driver Login",
      subManager: "Enter your Manager PIN to view fleet data",
      subDriver: "Enter your Vehicle ID and Driver PIN",
      idLabel: "Vehicle ID",
      pinLabel: "PIN Code",
      unlock: "Unlock",
      checking: "Verifying...",
      missingFields: "Please enter all required fields.",
      invalidPin: "Invalid PIN or Vehicle ID.",
      netError: "Network error. Please try again."
    },
    ar: {
      dir: "rtl",
      switchLabel: "English",
      brandManager: "إدارة الأسطول",
      brandDriver: "لوحة السائق",
      headingManager: "قفل رمز المدير",
      headingDriver: "دخول السائق",
      subManager: "أدخل رمز PIN الخاص بالمدير لعرض بيانات الأسطول",
      subDriver: "أدخل رمز المركبة ورمز PIN الخاص بالسائق",
      idLabel: "رمز المركبة",
      pinLabel: "رمز PIN",
      unlock: "دخول",
      checking: "جاري التحقق...",
      missingFields: "يرجى إدخال جميع الحقول المطلوبة.",
      invalidPin: "رمز PIN أو رمز المركبة غير صحيح.",
      netError: "خطأ في الاتصال. حاول مرة أخرى."
    }
  };

  let pinLang = localStorage.getItem("fleet_lang") === "ar" ? "ar" : "en";

  function applyPinLang() {
    const t = PIN_I18N[pinLang];
    const card = document.getElementById("fleetPinCard");
    card.setAttribute("dir", t.dir);
    document.documentElement.setAttribute("dir", t.dir);

    document.getElementById("pinLangBtn").textContent = t.switchLabel;
    document.getElementById("pinBrandTitle").textContent = APP_MODE === "driver" ? t.brandDriver : t.brandManager;
    document.getElementById("pinHeading").textContent = APP_MODE === "driver" ? t.headingDriver : t.headingManager;
    document.getElementById("pinSubtext").textContent = APP_MODE === "driver" ? t.subDriver : t.subManager;
    document.getElementById("driverIdLabel").textContent = t.idLabel;
    document.getElementById("pinCodeLabel").textContent = t.pinLabel;
    document.getElementById("pinSubmitBtn").textContent = t.unlock;
  }

  function togglePinLang() {
    pinLang = pinLang === "en" ? "ar" : "en";
    localStorage.setItem("fleet_lang", pinLang);
    applyPinLang();
  }

  function getSavedAuth() {
    if (APP_MODE === "driver") {
      return {
        vehicleId: localStorage.getItem("fleet_driver_vehicle_id") || "",
        pin: localStorage.getItem("fleet_driver_pin") || ""
      };
    }
    return {
      pin: localStorage.getItem("fleet_manager_pin") || ""
    };
  }

  function logoutFleetSession() {
    if (APP_MODE === "driver") {
      localStorage.removeItem("fleet_driver_vehicle_id");
      localStorage.removeItem("fleet_driver_pin");
    } else {
      localStorage.removeItem("fleet_manager_pin");
    }
    location.reload();
  }

  async function submitPinLogin() {
    const t = PIN_I18N[pinLang];
    const msgEl = document.getElementById("pinMsg");
    const btn = document.getElementById("pinSubmitBtn");
    const pin = document.getElementById("pinCodeInput").value.trim();
    const vehicleId = document.getElementById("pinVehicleId").value.trim().toUpperCase();

    msgEl.textContent = "";
    if (!pin || (APP_MODE === "driver" && !vehicleId)) {
      msgEl.textContent = t.missingFields;
      return;
    }

    btn.disabled = true;
    btn.textContent = t.checking;

    try {
      const bodyPayload = APP_MODE === "driver"
        ? { action: "driver_login", vehicleId, pin }
        : { action: "manager_login", pin };

      const resp = await fetch(PIN_API_URL, {
        method: "POST",
        body: JSON.stringify(bodyPayload)
      });
      const data = await resp.json();

      const isValid = APP_MODE === "driver"
        ? data.status === "ok"
        : (data.status === "ok" && data.authorized === true);

      if (isValid) {
        if (APP_MODE === "driver") {
          localStorage.setItem("fleet_driver_vehicle_id", vehicleId);
          localStorage.setItem("fleet_driver_pin", pin);
        } else {
          localStorage.setItem("fleet_manager_pin", pin);
        }
        document.getElementById("fleetPinModal").style.display = "none";
        if (typeof onFleetUnlocked === "function") {
          onFleetUnlocked(getSavedAuth());
        }
      } else {
        msgEl.textContent = t.invalidPin;
      }
    } catch (err) {
      msgEl.textContent = t.netError;
    } finally {
      btn.disabled = false;
      btn.textContent = t.unlock;
    }
  }

  window.addEventListener("DOMContentLoaded", () => {
    if (APP_MODE === "driver") {
      document.getElementById("driverIdGroup").style.display = "block";
    }
    applyPinLang();

    const saved = getSavedAuth();
    const alreadyLoggedIn = APP_MODE === "driver"
      ? Boolean(saved.vehicleId && saved.pin)
      : Boolean(saved.pin);

    if (alreadyLoggedIn) {
      document.getElementById("fleetPinModal").style.display = "none";
      if (typeof onFleetUnlocked === "function") {
        onFleetUnlocked(saved);
      }
    }
  });
</script>
