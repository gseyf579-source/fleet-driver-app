<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fleet Manager Live Dashboard</title>

  <!-- Installable Mobile Web App (PWA) Tags -->
  <meta name="application-name" content="Fleet Manager" />
  <meta name="apple-mobile-web-app-title" content="Fleet Manager" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href='data:application/manifest+json,{"name":"Fleet Manager Live Dashboard","short_name":"Fleet Manager","start_url":"https://gseyf579-source.github.io/fleet-driver-app/manager.html","scope":"https://gseyf579-source.github.io/fleet-driver-app/","display":"standalone","background_color":"#0f172a","theme_color":"#0f172a","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2554/2554978.png","sizes":"512x512","type":"image/png"}]}' />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2554/2554978.png" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #22c55e;
      --amber: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      max-width: 960px;
      margin: 0 auto;
    }
    header { margin-bottom: 16px; }
    h1 { font-size: 1.45rem; font-weight: 700; margin-bottom: 4px; }
    #statusText { font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 16px 0;
    }
    @media (min-width: 700px) {
      .kpi-grid { grid-template-columns: repeat(4, 1fr); }
    }
    .kpi-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .kpi-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .kpi-value { font-size: 1.65rem; font-weight: 700; }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .panel-title { font-weight: 600; font-size: 0.95rem; }
    .panel-sub { font-size: 0.78rem; color: var(--muted); }
    #map { height: 340px; width: 100%; z-index: 1; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    th {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--muted);
      background: rgba(15, 23, 42, 0.45);
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(34, 197, 94, 0.15);
      color: var(--green);
    }
  </style>
</head>
<body>
  <header>
    <h1>Fleet Manager Live Dashboard</h1>
    <div id="statusText">Loading fleet data...</div>
    <div class="btn-row">
      <button id="refreshBtn" onclick="loadDashboard()">Refresh Now</button>
    </div>
  </header>

  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-label">Tracked Vehicles</div>
      <div class="kpi-value" id="statVehicles">0</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">GPS Pings Logged</div>
      <div class="kpi-value" id="statPings">0</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Total Fuel (Liters)</div>
      <div class="kpi-value" id="statFuel">0.0 L</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Activity / Rest Logs</div>
      <div class="kpi-value" id="statActivity">0</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">Live Vehicle Map</span>
      <span class="panel-sub">Click pin for driver details</span>
    </div>
    <div id="map"></div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">Fleet Status & Latest Logs</span>
      <span class="panel-sub">Auto-updates every 30s</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Vehicle ID</th>
            <th>Driver</th>
            <th>Status</th>
            <th>Last Update</th>
          </tr>
        </thead>
        <tbody id="fleetTableBody">
          <tr><td colspan="4" style="color:var(--muted);">Loading records...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzBEGk_tVcQ3djSVTHisqbRwpy40kQ6acAZC9ph8Sb7NcShT78J0NuSYqG5mYubsnym_g/exec";

    // Initialize map centered on Baghdad
    const map = L.map('map').setView([33.3152, 44.3661], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let markersLayer = L.layerGroup().addTo(map);

    function extractLatLng(row) {
      let lat = parseFloat(row.Latitude || row.Lat || row.latitude);
      let lng = parseFloat(row.Longitude || row.Lng || row.Lon || row.longitude);
      if (!isNaN(lat) && !isNaN(lng)) return [lat, lng];

      for (let key in row) {
        if (typeof row[key] === 'string' && row[key].includes(',')) {
          const parts = row[key].split(',').map(s => parseFloat(s.trim()));
          if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
            return parts;
          }
        }
      }
      return null;
    }

    function formatTime(ts) {
      if (!ts) return "-";
      const d = new Date(ts);
      return isNaN(d.getTime()) ? String(ts) : d.toLocaleString();
    }

    async function loadDashboard() {
      const statusEl = document.getElementById('statusText');
      statusEl.innerText = "Syncing...";

      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();

        const gpsLogs = data.gps || [];
        const fuelLogs = data.fuel || [];
        const vehiclesList = data.vehicles || [];
        const activityLogs = data.activity || [];

        // Update Top KPI Cards
        document.getElementById('statPings').innerText = gpsLogs.length;
        document.getElementById('statActivity').innerText = activityLogs.length;

        let totalLiters = 0;
        fuelLogs.forEach(f => {
          const liters = parseFloat(f.Liters_Added || f.Liters || f.Fuel_Amount || f.Quantity || 0);
          if (!isNaN(liters)) totalLiters += liters;
        });
        document.getElementById('statFuel').innerText = totalLiters.toFixed(1) + " L";

        // Group latest GPS position by Vehicle ID
        const latestByVehicle = {};
        gpsLogs.forEach(row => {
          const vId = row.Vehicle_ID || row.Vehicle || row.Truck || "Unknown";
          latestByVehicle[vId] = row;
        });

        // Merge latest activity/rest status
        const latestActivityByVehicle = {};
        activityLogs.forEach(act => {
          const vId = act.Vehicle_ID || act.Vehicle || act.Truck;
          if (vId) latestActivityByVehicle[vId] = act;
        });

        // Count unique vehicles from Vehicles sheet + GPS logs
        const allVehicleIds = new Set([
          ...vehiclesList.map(v => v.Vehicle_ID).filter(Boolean),
          ...Object.keys(latestByVehicle)
        ]);
        document.getElementById('statVehicles').innerText = allVehicleIds.size;

        // Update Map Markers & Table
        markersLayer.clearLayers();
        const tbody = document.getElementById('fleetTableBody');
        tbody.innerHTML = "";

        const bounds = [];

        if (allVehicleIds.size === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="color:var(--muted);">No vehicle records found yet.</td></tr>';
        } else {
          allVehicleIds.forEach(vId => {
            const gps = latestByVehicle[vId] || {};
            const act = latestActivityByVehicle[vId] || {};
            const veh = vehiclesList.find(v => v.Vehicle_ID === vId) || {};

            const driver = act.Driver_Name || gps.Driver_Name || veh.Driver_Name || "Assigned Driver";
            const status = act.Status || veh.Status || "Active";
            const lastTime = formatTime(gps.Timestamp || act.Timestamp);
            const speed = gps.Speed !== undefined ? `${gps.Speed} km/h` : "-";

            // Table Row
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td><strong>${vId}</strong>${veh.Plate_Number ? `<br><small style="color:var(--muted)">${veh.Plate_Number}</small>` : ""}</td>
              <td>${driver}</td>
              <td><span class="badge">${status}</span></td>
              <td>${lastTime}</td>
            `;
            tbody.appendChild(tr);

            // Map Pin
            const coords = extractLatLng(gps);
            if (coords) {
              bounds.push(coords);
              const marker = L.marker(coords).addTo(markersLayer);
              marker.bindPopup(`
                <strong>${vId}</strong> ${veh.Plate_Number ? `(${veh.Plate_Number})` : ""}<br>
                <b>Driver:</b> ${driver}<br>
                <b>Status:</b> ${status}<br>
                <b>Speed:</b> ${speed}<br>
                <b>Updated:</b> ${lastTime}
              `);
            }
          });
        }

        if (bounds.length > 0) {
          map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
        }

        statusEl.innerText = "Last synced: " + new Date().toLocaleTimeString();
      } catch (err) {
        console.error(err);
        statusEl.innerText = "Error loading data. Check Apps Script deployment.";
      }
    }

    loadDashboard();
    setInterval(loadDashboard, 30000);
  </script>
</body>
</html>
