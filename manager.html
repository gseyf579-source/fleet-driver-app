<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fleet Manager Live Console</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --green: #10b981;
      --amber: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px; margin-bottom: 16px;
      padding-bottom: 12px; border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 1.35rem; font-weight: 700; }
    .controls { display: flex; gap: 10px; align-items: center; }
    button {
      background: var(--primary); color: white; border: none;
      padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600;
    }
    button:hover { opacity: 0.9; }
    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px; margin-bottom: 16px;
    }
    .stat-card {
      background: var(--card); border: 1px solid var(--border);
      padding: 14px; border-radius: 10px;
    }
    .stat-label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; }
    .stat-val { font-size: 1.5rem; font-weight: 700; margin-top: 4px; }
    .grid-main {
      display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px;
    }
    @media (max-width: 900px) { .grid-main { grid-template-columns: 1fr; } }
    .panel {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;
    }
    .panel-header {
      padding: 12px 16px; font-weight: 600; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    #map { height: 420px; width: 100%; z-index: 1; }
    .table-wrap { overflow-x: auto; max-height: 420px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--card); }
    .badge {
      padding: 3px 8px; border-radius: 999px; font-size: 0.75rem; font-weight: 600;
    }
    .badge-active { background: rgba(16, 185, 129, 0.2); color: var(--green); }
    .badge-rest { background: rgba(245, 158, 11, 0.2); color: var(--amber); }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Fleet Manager Live Dashboard</h1>
    <small id="lastUpdated" style="color: var(--muted);">Connecting to Google Sheets...</small>
  </div>
  <div class="controls">
    <button onclick="loadFleetData()">Refresh Now</button>
  </div>
</header>

<div class="stats">
  <div class="stat-card">
    <div class="stat-label">Tracked Vehicles</div>
    <div class="stat-val" id="statVehicles">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">GPS Pings Logged</div>
    <div class="stat-val" id="statPings">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Total Fuel (Liters)</div>
    <div class="stat-val" id="statFuel">0 L</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Activity / Rest Logs</div>
    <div class="stat-val" id="statActivity">0</div>
  </div>
</div>

<div class="grid-main">
  <div class="panel">
    <div class="panel-header">
      <span>Live Vehicle Map</span>
      <span style="font-size:0.75rem; color:var(--muted);">Click pin for driver details</span>
    </div>
    <div id="map"></div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span>Latest Vehicle Status</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Vehicle</th>
            <th>Driver</th>
            <th>Status / Coords</th>
            <th>Last Update</th>
          </tr>
        </thead>
        <tbody id="fleetTableBody">
          <tr><td colspan="4" style="color:var(--muted);">Loading records...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL BELOW:
  const SCRIPT_URL = "YOUR_APPS_SCRIPT_WEB_APP_URL";

  // Initialize map centered on Baghdad
  const map = L.map('map').setView([33.3152, 44.3661], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  let markersLayer = L.layerGroup().addTo(map);

  function extractLatLng(row) {
    // Supports separate Latitude/Longitude columns OR combined "lat, lng" string
    let lat = parseFloat(row.Latitude || row.Lat || row.latitude);
    let lng = parseFloat(row.Longitude || row.Lng || row.Lon || row.longitude);
    if (!isNaN(lat) && !isNaN(lng)) return [lat, lng];

    for (let key in row) {
      if (typeof row[key] === 'string' && row[key].includes(',')) {
        const parts = row[key].split(',').map(Number);
        if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
          return parts;
        }
      }
    }
    return null;
  }

  async function loadFleetData() {
    if (SCRIPT_URL === "https://script.google.com/macros/s/AKfycbzBEGk_tVcQ3djSVTHisqbRwpy40kQ6acAZC9ph8Sb7NcShT78J0NuSYqG5mYubsnym_g/exec") {
      document.getElementById('lastUpdated').innerText = "Please insert your Apps Script URL in manager.html";
      return;
    }

    try {
      document.getElementById('lastUpdated').innerText = "Syncing...";
      const res = await fetch(SCRIPT_URL);
      const data = await res.json();

      const gpsLogs = data.gps || [];
      const fuelLogs = data.fuel || [];
      const activityLogs = data.activity || [];

      // Update Top KPI Cards
      document.getElementById('statPings').innerText = gpsLogs.length;
      document.getElementById('statActivity').innerText = activityLogs.length;

      let totalLiters = 0;
      fuelLogs.forEach(f => {
        const liters = parseFloat(f.Liters || f.Fuel_Amount || f.Quantity || 0);
        if (!isNaN(liters)) totalLiters += liters;
      });
      document.getElementById('statFuel').innerText = totalLiters.toFixed(1) + " L";

      // Group latest GPS position by Vehicle ID
      const latestByVehicle = {};
      gpsLogs.forEach(row => {
        const vId = row.Vehicle_ID || row.Vehicle || row.Truck || "Unknown";
        latestByVehicle[vId] = row;
      });

      // Merge latest activity/rest status if available
      const latestStatusByVehicle = {};
      activityLogs.forEach(row => {
        const vId = row.Vehicle_ID || row.Vehicle || "Unknown";
        latestStatusByVehicle[vId] = row.Status || row.Activity || "Active";
      });

      const vehicleKeys = Object.keys(latestByVehicle);
      document.getElementById('statVehicles').innerText = vehicleKeys.length;

      // Clear old markers & table
      markersLayer.clearLayers();
      const tbody = document.getElementById('fleetTableBody');
      tbody.innerHTML = "";

      if (vehicleKeys.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="color:var(--muted);">No GPS logs found yet.</td></tr>`;
      }

      const bounds = [];

      vehicleKeys.forEach(vId => {
        const row = latestByVehicle[vId];
        const driver = row.Driver_Name || row.Driver || "—";
        const time = row.Timestamp || row.Date || "—";
        const status = latestStatusByVehicle[vId] || row.Status || "Active";
        const coords = extractLatLng(row);

        const isRest = status.toLowerCase().includes("rest");
        const badgeClass = isRest ? "badge-rest" : "badge-active";

        // Add row to table
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${vId}</strong></td>
          <td>${driver}</td>
          <td>
            <span class="badge ${badgeClass}">${status}</span><br/>
            <small style="color:var(--muted);">${coords ? coords[0].toFixed(4) + ", " + coords[1].toFixed(4) : "No GPS"}</small>
          </td>
          <td><small>${time}</small></td>
        `;
        tbody.appendChild(tr);

        // Plot pin on map
        if (coords) {
          bounds.push(coords);
          const marker = L.marker(coords).bindPopup(`
            <b>${vId}</b><br/>
            Driver: ${driver}<br/>
            Status: ${status}<br/>
            Time: ${time}
          `);
          markersLayer.addLayer(marker);
        }
      });

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
      }

      document.getElementById('lastUpdated').innerText = "Last synced: " + new Date().toLocaleTimeString();
    } catch (err) {
      console.error(err);
      document.getElementById('lastUpdated').innerText = "Error loading data. Check Apps Script deployment.";
    }
  }

  loadFleetData();
  setInterval(loadFleetData, 30000); // Auto-refresh every 30 seconds
</script>
</body>
</html>
