<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fleet Manager Live Dashboard</title>

  <!-- Installable Mobile Web App (PWA) Tags -->
  <meta name="application-name" content="Fleet Manager" />
  <meta name="apple-mobile-web-app-title" content="Fleet Manager" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" type="image/png" href="https://gseyf579-source.github.io/fleet-driver-app/20261120_100413_0000.png" />
  <link rel="apple-touch-icon" href="https://gseyf579-source.github.io/fleet-driver-app/20261120_100413_0000.png" />
  <link rel="manifest" href='data:application/manifest+json,{"name":"Fleet Manager Live Dashboard","short_name":"Fleet Manager","start_url":"https://gseyf579-source.github.io/fleet-driver-app/manager.html","scope":"https://gseyf579-source.github.io/fleet-driver-app/","display":"standalone","background_color":"#0f172a","theme_color":"#0f172a","icons":[{"src":"https://gseyf579-source.github.io/fleet-driver-app/20261120_100413_0000.png","sizes":"512x512","type":"image/png"}]}' />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #22c55e;
      --amber: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      max-width: 960px;
      margin: 0 auto;
    }
    header { margin-bottom: 16px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
    h1 { font-size: 1.4rem; font-weight: 700; }
    #statusText { font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    .lang-btn {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
    }
    .lang-btn:hover { background: var(--border); }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 16px 0;
    }
    @media (min-width: 700px) {
      .kpi-grid { grid-template-columns: repeat(4, 1fr); }
    }
    .kpi-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .kpi-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .kpi-value { font-size: 1.65rem; font-weight: 700; }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .panel-title { font-weight: 600; font-size: 0.95rem; }
    .panel-sub { font-size: 0.78rem; color: var(--muted); }
    #map { height: 340px; width: 100%; z-index: 1; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td {
      text-align: start;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    th {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--muted);
      background: rgba(15, 23, 42, 0.45);
    }
    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(34, 197, 94, 0.15);
      color: var(--green);
    }
  </style>
</head>
<body>
  <header>
    <div class="top-bar">
      <h1 id="dashTitle">Fleet Manager Live Dashboard</h1>
      <button class="lang-btn" id="langBtn" onclick="toggleLang()">عربي</button>
    </div>
    <div id="statusText">Loading fleet data...</div>
    <div class="btn-row">
      <button id="refreshBtn" onclick="loadDashboard()">Refresh Now</button>
    </div>
  </header>

  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-label" id="lblStatVehicles">Tracked Vehicles</div>
      <div class="kpi-value" id="statVehicles">0</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label" id="lblStatPings">GPS Pings Logged</div>
      <div class="kpi-value" id="statPings">0</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label" id="lblStatFuel">Total Fuel (Liters)</div>
      <div class="kpi-value" id="statFuel">0.0 L</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label" id="lblStatActivity">Activity / Rest Logs</div>
      <div class="kpi-value" id="statActivity">0</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span class="panel-title" id="mapTitle">Live Vehicle Map</span>
      <span class="panel-sub" id="mapSub">Click pin for driver details</span>
    </div>
    <div id="map"></div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span class="panel-title" id="tblTitle">Fleet Status & Latest Logs</span>
      <span class="panel-sub" id="tblSub">Auto-updates every 30s</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th id="thVehicle">Vehicle ID</th>
            <th id="thDriver">Driver</th>
            <th id="thStatus">Status</th>
            <th id="thUpdate">Last Update</th>
          </tr>
        </thead>
        <tbody id="fleetTableBody">
          <tr><td colspan="4" style="color:var(--muted);">Loading records...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzBEGk_tVcQ3djSVTHisqbRwpy40kQ6acAZC9ph8Sb7NcShT78J0NuSYqG5mYubsnym_g/exec";

    const I18N = {
      en: {
        dir: "ltr",
        langBtn: "عربي",
        dashTitle: "Fleet Manager Live Dashboard",
        refreshBtn: "Refresh Now",
        syncing: "Syncing...",
        lastSynced: (time) => `Last synced: ${time}`,
        errLoad: "Error loading data. Check Apps Script deployment.",
        lblStatVehicles: "Tracked Vehicles",
        lblStatPings: "GPS Pings Logged",
        lblStatFuel: "Total Fuel (Liters)",
        lblStatActivity: "Activity / Rest Logs",
        mapTitle: "Live Vehicle Map",
        mapSub: "Click pin for driver details",
        tblTitle: "Fleet Status & Latest Logs",
        tblSub: "Auto-updates every 30s",
        thVehicle: "Vehicle ID",
        thDriver: "Driver",
        thStatus: "Status",
        thUpdate: "Last Update",
        noRecords: "No vehicle records found yet.",
        assignedDriver: "Assigned Driver",
        popDriver: "Driver",
        popStatus: "Status",
        popSpeed: "Speed",
        popUpdated: "Updated",
        statuses: {
          "Active": "Active",
          "Driving": "Driving",
          "Resting": "Resting",
          "Loading / Unloading": "Loading / Unloading",
          "Refueling": "Refueling",
          "Maintenance / Breakdown": "Maintenance",
          "Off Duty": "Off Duty"
        }
      },
      ar: {
        dir: "rtl",
        langBtn: "English",
        dashTitle: "لوحة متابعة الأسطول المباشرة",
        refreshBtn: "تحديث الآن",
        syncing: "جاري المزامنة...",
        lastSynced: (time) => `آخر تحديث: ${time}`,
        errLoad: "خطأ في تحميل البيانات. تحقق من رابط Apps Script.",
        lblStatVehicles: "المركبات المتتبعة",
        lblStatPings: "إحداثيات GPS المسجلة",
        lblStatFuel: "إجمالي الوقود (لتر)",
        lblStatActivity: "سجلات النشاط والاستراحة",
        mapTitle: "الخريطة المباشرة للمركبات",
        mapSub: "اضغط على العلامة لعرض تفاصيل السائق",
        tblTitle: "حالة الأسطول وآخر السجلات",
        tblSub: "تحديث تلقائي كل 30 ثانية",
        thVehicle: "رقم المركبة",
        thDriver: "السائق",
        thStatus: "الحالة",
        thUpdate: "آخر تحديث",
        noRecords: "لا توجد سجلات مركبات حتى الآن.",
        assignedDriver: "سائق معيّن",
        popDriver: "السائق",
        popStatus: "الحالة",
        popSpeed: "السرعة",
        popUpdated: "التحديث",
        statuses: {
          "Active": "نشط",
          "Driving": "في الطريق (قيادة)",
          "Resting": "استراحة",
          "Loading / Unloading": "تحميل / تفريغ",
          "Refueling": "تعبئة وقود",
          "Maintenance / Breakdown": "صيانة / عطل",
          "Off Duty": "خارج الخدمة"
        }
      }
    };

    let currentLang = localStorage.getItem("fleet_lang") || "en";
    let cachedData = null;

    const map = L.map('map').setView([33.3152, 44.3661], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let markersLayer = L.layerGroup().addTo(map);

    function applyLanguage() {
      const t = I18N[currentLang];
      document.documentElement.lang = currentLang;
      document.documentElement.dir = t.dir;

      document.getElementById("langBtn").textContent = t.langBtn;
      document.getElementById("dashTitle").textContent = t.dashTitle;
      document.getElementById("refreshBtn").textContent = t.refreshBtn;
      document.getElementById("lblStatVehicles").textContent = t.lblStatVehicles;
      document.getElementById("lblStatPings").textContent = t.lblStatPings;
      document.getElementById("lblStatFuel").textContent = t.lblStatFuel;
      document.getElementById("lblStatActivity").textContent = t.lblStatActivity;
      document.getElementById("mapTitle").textContent = t.mapTitle;
      document.getElementById("mapSub").textContent = t.mapSub;
      document.getElementById("tblTitle").textContent = t.tblTitle;
      document.getElementById("tblSub").textContent = t.tblSub;
      document.getElementById("thVehicle").textContent = t.thVehicle;
      document.getElementById("thDriver").textContent = t.thDriver;
      document.getElementById("thStatus").textContent = t.thStatus;
      document.getElementById("thUpdate").textContent = t.thUpdate;

      if (cachedData) renderDashboard(cachedData);
    }

    function toggleLang() {
      currentLang = currentLang === "en" ? "ar" : "en";
      localStorage.setItem("fleet_lang", currentLang);
      applyLanguage();
    }

    function extractLatLng(row) {
      let lat = parseFloat(row.Latitude || row.Lat || row.latitude);
      let lng = parseFloat(row.Longitude || row.Lng || row.Lon || row.longitude);
      if (!isNaN(lat) && !isNaN(lng)) return [lat, lng];

      for (let key in row) {
        if (typeof row[key] === 'string' && row[key].includes(',')) {
          const parts = row[key].split(',').map(s => parseFloat(s.trim()));
          if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
            return parts;
          }
        }
      }
      return null;
    }

    function formatTime(ts) {
      if (!ts) return "-";
      const d = new Date(ts);
      return isNaN(d.getTime()) ? String(ts) : d.toLocaleString();
    }

    function renderDashboard(data) {
      const t = I18N[currentLang];
      const gpsLogs = data.gps || [];
      const fuelLogs = data.fuel || [];
      const vehiclesList = data.vehicles || [];
      const activityLogs = data.activity || [];

      document.getElementById('statPings').innerText = gpsLogs.length;
      document.getElementById('statActivity').innerText = activityLogs.length;

      let totalLiters = 0;
      const latestFuelByVehicle = {};
      fuelLogs.forEach(f => {
        const liters = parseFloat(f.Liters_Added || f.Liters || f.Fuel_Amount || f.Quantity || 0);
        if (!isNaN(liters)) totalLiters += liters;
        const vId = f.Vehicle_ID || f.Vehicle || f.Truck;
        if (vId) latestFuelByVehicle[vId] = f;
      });
      document.getElementById('statFuel').innerText = totalLiters.toFixed(1) + (currentLang === "ar" ? " لتر" : " L");

      const latestByVehicle = {};
      gpsLogs.forEach(row => {
        const vId = row.Vehicle_ID || row.Vehicle || row.Truck || "Unknown";
        latestByVehicle[vId] = row;
      });

      const latestActivityByVehicle = {};
      activityLogs.forEach(act => {
        const vId = act.Vehicle_ID || act.Vehicle || act.Truck;
        if (vId) latestActivityByVehicle[vId] = act;
      });

      const allVehicleIds = new Set([
        ...vehiclesList.map(v => v.Vehicle_ID).filter(Boolean),
        ...Object.keys(latestByVehicle)
      ]);
      document.getElementById('statVehicles').innerText = allVehicleIds.size;

      markersLayer.clearLayers();
      const tbody = document.getElementById('fleetTableBody');
      tbody.innerHTML = "";
      const bounds = [];

      if (allVehicleIds.size === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="color:var(--muted);">${t.noRecords}</td></tr>`;
      } else {
        allVehicleIds.forEach(vId => {
          const gps = latestByVehicle[vId] || {};
          const act = latestActivityByVehicle[vId] || {};
          const fuel = latestFuelByVehicle[vId] || {};
          const veh = vehiclesList.find(v => v.Vehicle_ID === vId) || {};

          const rawDriver = act.Driver_Name || gps.Driver_Name || fuel.Driver_Name || veh.Driver_Name;
          const driver = (!rawDriver || rawDriver === "Unknown Driver") ? t.assignedDriver : rawDriver;
          const rawStatus = act.Status || veh.Status || "Active";
          const status = t.statuses[rawStatus] || rawStatus;
          const lastTime = formatTime(gps.Timestamp || act.Timestamp);
          const speed = gps.Speed !== undefined ? `${gps.Speed} ${currentLang === "ar" ? "كم/س" : "km/h"}` : "-";

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${vId}</strong>${veh.Plate_Number ? `<br><small style="color:var(--muted)">${veh.Plate_Number}</small>` : ""}</td>
            <td>${driver}</td>
            <td><span class="badge">${status}</span></td>
            <td>${lastTime}</td>
          `;
          tbody.appendChild(tr);

          const coords = extractLatLng(gps);
          if (coords) {
            bounds.push(coords);
            const marker = L.marker(coords).addTo(markersLayer);
            marker.bindPopup(`
              <div dir="${t.dir}" style="text-align:start;">
                <strong>${vId}</strong> ${veh.Plate_Number ? `(${veh.Plate_Number})` : ""}<br>
                <b>${t.popDriver}:</b> ${driver}<br>
                <b>${t.popStatus}:</b> ${status}<br>
                <b>${t.popSpeed}:</b> ${speed}<br>
                <b>${t.popUpdated}:</b> ${lastTime}
              </div>
            `);
          }
        });
      }

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
      }
    }

    async function loadDashboard() {
      const t = I18N[currentLang];
      const statusEl = document.getElementById('statusText');
      statusEl.innerText = t.syncing;

      try {
        const res = await fetch(SCRIPT_URL);
        cachedData = await res.json();
        renderDashboard(cachedData);
        statusEl.innerText = I18N[currentLang].lastSynced(new Date().toLocaleTimeString());
      } catch (err) {
        console.error(err);
        statusEl.innerText = I18N[currentLang].errLoad;
      }
    }

    applyLanguage();
    loadDashboard();
    setInterval(loadDashboard, 30000);
  </script>
</body>
</html>
